<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SINGLE ARTWORK EXHIBITION</title>
    <link rel="stylesheet" href="prototype_3.css">
</head>
<body>

    <!-- レトロ・ファインダー固定UI (HUD) -->
    <div class="finder-hud" id="finder-hud">
        <!-- 4隅の枠マーク -->
        <span class="corner top-left"></span>
        <span class="corner top-right"></span>
        <span class="corner bottom-left"></span>
        <span class="corner bottom-right"></span>

        <!-- CRT走査線ノイズ -->
        <div class="scan-line"></div>

        <!-- 中央のクラシッククロスヘア -->
        <div class="crosshair-wrapper"></div>

        <!-- 縦型ゲージ -->
        <div class="hud-gauge">
            <div class="gauge-bar" id="gauge-bar"></div>
            <span class="gauge-num" id="gauge-num">000</span>
        </div>

        <!-- カメラ情報表示（上部） -->
        <div class="hud-top">
            <div class="rec-indicator">
                <span class="rec-dot"></span>
                <span>REC</span>
            </div>
            <span id="hud-mode">MANUAL / AF-SEARCH</span>
            <span>BATTERY ▮▮▮▯</span>
        </div>

        <!-- カメラ情報表示（下部） -->
        <div class="hud-bottom">
            <div>
                <span>STATUS: <strong id="hud-status">FOCUSING...</strong></span>
            </div>
            <div>
                <span id="hud-zoom" class="hud-val">ISO 400</span>
                <span style="margin-left: 15px; color: #f0e6d2;">1998.10.31</span>
            </div>
        </div>
    </div>

    <!-- 1枚のイラストキャンバス -->
    <div class="artwork-viewport" id="artwork-viewport" data-active-step="step-1">
        <div class="artwork-inner">
            <img class="artwork-img" src="/IMAGE/shikun752HY5A0746_TP_V.jpg" alt="Emerald Coast">
            <!-- ビデオ/フィルムノイズオーバーレイ -->
            <div class="lens-glare"></div>
        </div>
        
        <div class="artwork-caption">
            <div class="caption-badge">FRAME #01 / 35mm</div>
            <div class="caption-title">EMERALD COAST</div>
            <div class="caption-sub">PHOTO ARCHIVE / 1998</div>
        </div>
    </div>

    <!-- スクロール領域 -->
    <main class="scroll-container" id="scroll-container">

        <!-- Step 1: アウトフォーカス（ピンボケ） -->
        <section class="view-step" id="step-1" data-step="step-1" data-label="AF-SEARCH" data-zoom="ISO 400" data-status="SEARCHING..."></section>

        <!-- Step 2: ピント合致 -->
        <section class="view-step" id="step-2" data-step="step-2" data-label="TARGET LOCKED" data-zoom="ISO 200" data-status="LOCKED"></section>

        <!-- Step 3: フルビュー -->
        <section class="view-step" id="step-3" data-step="step-3" data-label="FULL VIEW" data-zoom="ISO 100" data-status="COMPLETE"></section>

        <!-- 展示終了後のコンテンツ -->
        <section class="content" id="content-section">
            <div class="content-inner">
                <h2>EXHIBITION COMPLETED</h2>
                <p>作品をご覧いただきありがとうございました。<br>作者のプロファイルやアーカイブ作品一覧は下記よりご確認いただけます。</p>
            </div>
        </section>

    </main>

<script>
    const steps = document.querySelectorAll('.view-step');
const viewport = document.getElementById('artwork-viewport');
const hud = document.getElementById('finder-hud');
const contentSection = document.getElementById('content-section');
const scrollContainer = document.getElementById('scroll-container');

const hudMode = document.getElementById('hud-mode');
const hudStatus = document.getElementById('hud-status');
const gaugeBar = document.getElementById('gauge-bar');
const gaugeNum = document.getElementById('gauge-num');

let isAutofocused = false;

// --------------------------------------------------
// 1. 初回読み込み：メリハリのある2段階アニメーション
// --------------------------------------------------
window.addEventListener('DOMContentLoaded', () => {
    scrollContainer.style.overflowY = 'hidden';

    // 【フェーズ 1】1.2秒後：ピントが「ピシッ」と合致する演出
    setTimeout(() => {
        // 画像のぼかしを解除しピントを合致させる
        viewport.setAttribute('data-active-step', 'step-2');
        
        // HUD枠が黄金色に発光・収束するクラスを付与
        hud.classList.add('mode-detail');
        if (hudMode) hudMode.textContent = 'AF-LOCK';
        if (hudStatus) hudStatus.textContent = 'LOCKED';
    }, 1200);

    // 【フェーズ 2】2.0秒後（ピント合致を確認した0.8秒後）：HUDが消去して画像が全画面化
    setTimeout(() => {
        isAutofocused = true;

        // 1. カメラUIを非表示にする
        hud.classList.add('hud-hidden');

        // 2. 画像キャンバスを画面全体（100vw × 100vh）へ拡大する
        viewport.classList.add('is-fullscreen');

        // 3. スクロールを解禁する
        scrollContainer.style.overflowY = 'scroll';
        document.body.classList.add('is-scrollable');
    }, 2000);
});

// --------------------------------------------------
// 2. スクロール連動処理
// --------------------------------------------------
scrollContainer.addEventListener('scroll', () => {
    if (!isAutofocused) return;

    const scrollTop = scrollContainer.scrollTop;
    const maxScroll = scrollContainer.scrollHeight - scrollContainer.clientHeight;
    const scrollRatio = Math.min(Math.max(scrollTop / maxScroll, 0), 1);

    document.documentElement.style.setProperty('--scroll-ratio', scrollRatio);
    if (gaugeBar) gaugeBar.style.height = `${scrollRatio * 100}%`;
    if (gaugeNum) gaugeNum.textContent = String(Math.round(scrollRatio * 100)).padStart(3, '0');
});

// セクション監視
const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if (!isAutofocused) return;

        if (entry.isIntersecting) {
            const step = entry.target.getAttribute('data-step');

            if (step === 'step-1') {
                viewport.setAttribute('data-active-step', 'step-2');
            } else {
                viewport.setAttribute('data-active-step', step);
            }
        }
    });
}, { threshold: 0.6 });

steps.forEach(step => observer.observe(step));

// コンテンツ到達監視
const contentObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            viewport.classList.add('is-hidden');
        } else {
            viewport.classList.remove('is-hidden');
        }
    });
}, { threshold: 0.1 });

contentObserver.observe(contentSection);
    </script>
</body>
</html>
